apiVersion: v1
kind: Service
metadata:
  name: fiap-fintech-api
  namespace: fiap-fintech-api
  labels:
    app: fiap-fintech-api
spec:
  type: ClusterIP
  selector:
    app: fiap-fintech-api
  ports:
    - name: http
      protocol: TCP
      port: 38000
      targetPort: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fiap-fintech-api-gateway
spec:
  gatewayClassName: ck-gateway
  listeners:
  - protocol: HTTP
    port: 38000
    name: web-gw
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-app-fiap-fintech-api
spec:
  parentRefs:
  - name: fiap-fintech-api-gateway
    namespace: fiap-fintech-api
  hostnames:
    - fintech.juhouse.com.br
  rules:
  - filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: "https"
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: fiap-fintech-api
      port: 38000
