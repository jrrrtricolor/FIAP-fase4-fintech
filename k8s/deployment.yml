apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-fintech-api-deployment
  namespace: fiap-fintech-api
  labels:
    app: fiap-fintech-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiap-fintech-api
  template:
    metadata:
      labels:
        app: fiap-fintech-api
    spec:
      containers:
      - name: fiap-fintech-api
        image: registry.fintech.juhouse.com.br/fiap-fintech-api:ci
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000  
          initialDelaySeconds: 5
          periodSeconds: 10
