[project]
name = "credit_monitoring"
version = "0.1.0"
description = "Monitoramento e analise de credito"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (==0.136.3)",
    "numpy (==2.5.3)",
    "onnxruntime>=1.29,<2.0",
    "prometheus-client>=0.21,<1.0",
    "prometheus-fastapi-instrumentator (>=8.1.0,<9.0.0)",
    "python-json-logger (>=4.2.0,<5.0.0)",
    "uvicorn>=0.30,<1.0",
    "pandas (==2.3.3)",
    "pandera[pandas] (==0.34.1)",
    "evidently (==0.7.23)",
    "scipy (==1.18.1)",
    "scikit-learn (==1.9.1)",
    "joblib (==1.6.0)",
    "mlflow (==3.17.0)",
    "matplotlib (==3.11.2)",
    "seaborn (==0.13.2)",
    "ipython (==9.17.1)",
    "jupyterlab (==4.6.4)",
    "pytest (==9.1.1)",
    "ruff (==0.16.10)",
    "flake8 (==7.3.0)",
]

[tool.poetry]
packages = [
    { include = "credit_monitoring", from = "src" },
    { include = "ml_prep_kit", from = "ml_prep_kit/src" },
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
httpx = ">=0.27,<1.0"
pytest = ">=8.3,<10.0"
ruff = ">=0.8,<1.0"

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
ipykernel = ">=6.29,<8.0"
jupyterlab = ">=4.3,<5.0"
matplotlib = ">=3.9,<4.0"
nbconvert = ">=7.16,<8.0"
seaborn = ">=0.13,<0.14"

[tool.poetry.group.pipeline]
optional = true

[tool.poetry.group.pipeline.dependencies]
dvc = ">=3.58,<4.0"

[tool.poetry.group.training]
optional = true

[tool.poetry.group.training.dependencies]
joblib = ">=1.4,<2.0"
mlflow = ">=3.0,<4.0"
pandas = ">=2.2,<3.0"
scikit-learn = ">=1.5,<2.0"
skl2onnx = ">=1.18,<2.0"

[tool.poetry.group.pytorch]
optional = true

[tool.poetry.group.pytorch.dependencies]
torch = ">=2.4,<3.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
